# Đóng gói bản THỬ v3.0 (giao diện web, pywebview) - chỉ chạy trên nhánh v3-web, KHÔNG tạo Release
# (bản v2.x trên máy người dùng không bị cập nhật lên bản thử). Kết quả: Artifact "PikPak-Auto-Save-v3-thu".
name: Build v3 test (web UI)
on:
  push:
    branches: [v3-web]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cai thu vien
        run: python -m pip install requests pystray pillow pyinstaller pywebview
      - name: Dong goi exe
        run: python -m PyInstaller --noconfirm --clean --onefile --noconsole --name "PikPak Auto Save v3 (thu nghiem)" --icon icon.ico --add-data "icon.ico;." --add-data "web;web" --collect-all webview --collect-all pythonnet --collect-all clr_loader --hidden-import pystray._win32 pikpak_auto_save_web.py
      - name: Chay thu exe (mo cua so, doc giao dien, chup man hinh)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force T | Out-Null
          Copy-Item 'dist/PikPak Auto Save v3 (thu nghiem).exe' T/
          $p = Start-Process -FilePath 'T/PikPak Auto Save v3 (thu nghiem).exe' -ArgumentList '--selftest' -PassThru
          if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; Write-Host "Qua 90s - dung" }
          if (Test-Path T/selftest.txt) { Get-Content T/selftest.txt } else { Write-Host "KHONG CO selftest.txt" }
          Get-ChildItem T
      - name: Tao file zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force PikPak-Auto-Save-v3-thu | Out-Null
          Copy-Item 'dist/PikPak Auto Save v3 (thu nghiem).exe', HUONG_DAN_V3_THU.txt PikPak-Auto-Save-v3-thu/
          Compress-Archive -Force PikPak-Auto-Save-v3-thu PikPak-Auto-Save-v3-thu.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PikPak-Auto-Save-v3-thu
          path: |
            PikPak-Auto-Save-v3-thu.zip
            T/selftest.txt
            T/selftest.png
